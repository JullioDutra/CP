<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eren e a caridade — Explicando de um Jeito Nerd</title>
<style>
:root{
  --ink:#0b0d17; --navy:#12162a; --red:#d2203a; --red2:#8e1b2c; --gold:#f2c14e;
  --cream:#f6efdf; --teal:#58c4c0; --skin:#dba77c; --skin2:#c48b62; --hair:#1b1310;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Inter,"Inter Display",system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--ink);color:var(--cream)}

/* ---------- motor de animação: tudo depende de --lt (tempo local do painel) ---------- */
.panel{position:absolute;inset:0;opacity:0;--lt:0}
.panel svg.art{position:absolute;left:0;top:150px;width:1080px;height:1000px;overflow:visible}
.an{--d:0;animation-duration:var(--dur,.7s);animation-fill-mode:both;animation-play-state:paused;
  animation-timing-function:cubic-bezier(.2,.9,.25,1);animation-delay:calc((var(--d,0) - var(--lt,0))*1s);
  transform-box:fill-box;transform-origin:center}
.loop{animation-duration:var(--dur,3s);animation-iteration-count:infinite;animation-play-state:paused;
  animation-timing-function:ease-in-out;animation-delay:calc(var(--lt,0)*-1s);transform-box:fill-box;transform-origin:center}
.lin{animation-timing-function:linear}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-60px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bob{0%,100%{transform:translateY(-8px)}50%{transform:translateY(8px)}}
@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes panA{0%,100%{transform:translateY(37px)}50%{transform:translateY(-37px)}}
@keyframes panB{0%,100%{transform:translateY(-37px)}50%{transform:translateY(37px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.09)}24%{transform:scale(1)}36%{transform:scale(1.06)}48%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,3px)}}
@keyframes fly{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@keyframes tear{0%{opacity:0;transform:translateY(0)}15%{opacity:1}80%{opacity:1;transform:translateY(46px)}100%{opacity:0;transform:translateY(52px)}}
@keyframes ripple{0%{opacity:.9;transform:scale(.1)}100%{opacity:0;transform:scale(1)}}
@keyframes leaf{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate(-140px,520px) rotate(300deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:.9}}

.t{font-weight:900;letter-spacing:.02em;fill:var(--cream)}
.serif{font-family:"DejaVu Serif",Georgia,serif}

/* ---------- cromo fixo ---------- */
#brand{position:absolute;left:0;right:0;top:54px;text-align:center;font-weight:800;font-size:27px;letter-spacing:.3em;color:rgba(246,239,223,.72)}
#brand b{color:var(--gold)}
#bar{position:absolute;left:60px;right:60px;top:112px;height:8px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;cursor:pointer}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:8px}
#chapter{position:absolute;left:60px;top:1162px;font-weight:800;font-size:24px;letter-spacing:.22em;color:var(--ink);background:var(--gold);padding:8px 18px;border-radius:30px}
#shade{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(180deg,rgba(8,9,16,0),rgba(8,9,16,.9) 30%,#080910 70%)}
#topshade{position:absolute;left:0;right:0;top:0;height:260px;background:linear-gradient(180deg,rgba(8,9,16,.8),rgba(8,9,16,0))}
#cap{position:absolute;left:50px;right:50px;top:1195px;height:200px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:900;font-size:62px;line-height:1.14;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 5px 0 rgba(0,0,0,.55),0 0 26px rgba(0,0,0,.7)}
#cap span{display:inline-block;margin:0 .13em;opacity:.38;transition:none}
#cap span.on{opacity:1}
#cap span.now{color:var(--gold);transform:scale(1.07)}
#boneco{position:absolute;top:1385px;left:0;width:350px;height:525px;overflow:visible;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
#boneco g{transform-box:view-box}
</style>
</head>
<body>
<div id="stage">

<!-- ============ P1 · Attack on Titan / dilema ============ -->
<section class="panel" data-from="a1" style="background:linear-gradient(180deg,#0a0c1c,#1b1f3d 55%,#3a2030)">
<svg class="art" viewBox="0 0 1080 1000">
  <g fill="#fff"><circle class="loop" style="--dur:2.3s" cx="120" cy="90" r="4"/><circle class="loop" style="--dur:3.1s" cx="330" cy="40" r="3"/><circle class="loop" style="--dur:2.7s" cx="620" cy="110" r="4"/><circle class="loop" style="--dur:3.6s" cx="900" cy="60" r="3"/><circle class="loop" style="--dur:2.1s" cx="990" cy="210" r="4"/><circle class="loop" style="--dur:2.9s" cx="60" cy="260" r="3"/></g>
  <style>#stage section:nth-of-type(1) circle.loop{animation-name:twinkle}</style>
  <g class="an" style="animation-name:up;--dur:1.2s">
    <path d="M-20 1000V520h70v-30h60v30h80v-30h60v30h80v-30h60v30h80v-30h60v30h80v-30h60v30h80v-30h60v30h80v-30h60v30h80v-30h60v30h60V1000Z" fill="#070912"/>
    <path d="M-20 600H1100M-20 690H1100M-20 780H1100M-20 870H1100" stroke="#141831" stroke-width="5"/>
    <path d="M140 1000V900l50-45 50 45v100ZM300 1000V870l70-60 70 60v130ZM600 1000V890l60-50 60 50v110ZM800 1000V860l75-65 75 65v140Z" fill="#141831"/>
    <rect x="345" y="900" width="26" height="36" fill="#f2c14e" opacity=".8"/><rect x="852" y="900" width="26" height="36" fill="#f2c14e" opacity=".8"/><rect x="178" y="930" width="22" height="30" fill="#f2c14e" opacity=".6"/>
  </g>
  <text class="t an" style="animation-name:down;--d:.5" x="540" y="250" text-anchor="middle" font-size="96" letter-spacing="6">ATTACK</text>
  <text class="t an" style="animation-name:down;--d:.7;fill:var(--red)" x="540" y="350" text-anchor="middle" font-size="96" letter-spacing="6">ON TITAN</text>
  <g class="an" data-b="a1" data-f=".7" style="animation-name:pop">
    <rect x="330" y="395" width="420" height="78" rx="39" fill="var(--gold)"/>
    <text x="540" y="449" text-anchor="middle" font-size="42" font-weight="900" fill="#0b0d17" letter-spacing="5">UM DILEMA</text>
  </g>
</svg>
</section>

<!-- ============ P2 · balança ============ -->
<section class="panel" data-from="a2" style="background:radial-gradient(900px 700px at 50% 30%,#2a2f5c,#0b0d17 75%)">
<svg class="art" viewBox="0 0 1080 1000">
  <text class="t an" style="animation-name:down" x="540" y="130" text-anchor="middle" font-size="76">ATÉ ONDE O BEM</text>
  <text class="t an" style="animation-name:down;--d:.25" x="540" y="220" text-anchor="middle" font-size="76">JUSTIFICA <tspan fill="var(--red)">O MAL?</tspan></text>
  <g class="an" style="animation-name:up;--d:.2">
    <rect x="525" y="350" width="30" height="520" rx="12" fill="#cfc6ae"/>
    <path d="M380 900h320l-40-50H420Z" fill="#cfc6ae"/>
    <g class="loop" style="animation-name:tilt;--dur:4s;transform-origin:50% 50%">
      <rect x="200" y="368" width="680" height="24" rx="12" fill="var(--cream)"/>
    </g>
    <circle cx="540" cy="380" r="34" fill="var(--gold)"/>
    <g class="loop" style="animation-name:panA;--dur:4s">
      <path d="M215 385L130 610M215 385L300 610" stroke="#cfc6ae" stroke-width="6"/>
      <path d="M100 610h230a115 80 0 0 1-230 0Z" fill="var(--gold)"/>
      <text x="215" y="670" text-anchor="middle" font-size="46" font-weight="900" fill="#0b0d17">BEM</text>
    </g>
    <g class="loop" style="animation-name:panB;--dur:4s">
      <path d="M865 385L780 610M865 385L950 610" stroke="#cfc6ae" stroke-width="6"/>
      <path d="M750 610h230a115 80 0 0 1-230 0Z" fill="var(--red)"/>
      <text x="865" y="670" text-anchor="middle" font-size="46" font-weight="900" fill="#fff">MAL</text>
    </g>
  </g>
</svg>
</section>

<!-- ============ P3 · caridade, liberdade, fé ============ -->
<section class="panel" data-from="a3" style="background:linear-gradient(160deg,#151a36,#0b0d17 60%,#2b1420)">
<svg class="art" viewBox="0 0 1080 1000">
  <text class="t an" style="animation-name:down" x="540" y="110" text-anchor="middle" font-size="60" fill-opacity=".8">A HISTÓRIA DE</text>
  <text class="t an" style="animation-name:down;--d:.3;fill:var(--gold)" x="540" y="215" text-anchor="middle" font-size="104">EREN YEAGER</text>
  <text class="t an" data-b="a3" data-f=".2" style="animation-name:up" x="540" y="330" text-anchor="middle" font-size="46" fill-opacity=".75" letter-spacing="4">PODE NOS ENSINAR SOBRE…</text>
  <g class="an" data-b="a3" data-f=".42" style="animation-name:pop">
    <circle cx="190" cy="560" r="140" fill="#2a1420" stroke="var(--red)" stroke-width="8"/>
    <path class="loop" style="animation-name:beat;--dur:1.4s" d="M190 640c-90-60-110-110-80-150 28-34 66-22 80 6 14-28 52-40 80-6 30 40 10 90-80 150Z" fill="var(--red)"/>
    <text class="t" x="190" y="775" text-anchor="middle" font-size="44">CARIDADE</text>
  </g>
  <g class="an" data-b="a3" data-f=".6" style="animation-name:pop">
    <circle cx="540" cy="560" r="140" fill="#12303a" stroke="var(--teal)" stroke-width="8"/>
    <g class="loop" style="animation-name:bob;--dur:2.2s"><path d="M440 560q50-70 100-10 50-60 100 10-50-30-100 20-50-50-100-20Z" fill="var(--teal)"/><circle cx="540" cy="575" r="14" fill="var(--teal)"/></g>
    <text class="t" x="540" y="775" text-anchor="middle" font-size="44">LIBERDADE</text>
  </g>
  <g class="an" data-b="a3" data-f=".8" style="animation-name:pop">
    <circle cx="890" cy="560" r="140" fill="#33290f" stroke="var(--gold)" stroke-width="8"/>
    <path d="M872 470h36v50h50v36h-50v100h-36V556h-50v-36h50Z" fill="var(--gold)"/>
    <text class="t" x="890" y="775" text-anchor="middle" font-size="44">FÉ</text>
  </g>
</svg>
</section>

<!-- ============ P4 · logo ============ -->
<section class="panel logo" data-from="a4" style="background:radial-gradient(800px 800px at 50% 35%,#3b1626,#0b0d17 75%)">
<svg class="art" viewBox="0 0 1080 1000">
  <g class="loop" style="animation-name:spin;--dur:40s;animation-timing-function:linear;transform-origin:540px 480px;transform-box:view-box" opacity=".18" stroke="var(--gold)" stroke-width="10">
    <path d="M540 480L540 -100M540 480L950 70M540 480L1120 480M540 480L950 890M540 480L540 1060M540 480L130 890M540 480L-40 480M540 480L130 70"/>
  </g>
  <g class="an" style="animation-name:pop;--d:.1">
    <g fill="none" stroke="var(--cream)" stroke-width="16"><rect x="330" y="150" width="180" height="130" rx="34"/><rect x="570" y="150" width="180" height="130" rx="34"/><path d="M510 205q30-26 60 0M330 200l-60-30M750 200l60-30"/></g>
    <rect x="352" y="172" width="50" height="22" rx="11" fill="var(--cream)" opacity=".5"/><rect x="592" y="172" width="50" height="22" rx="11" fill="var(--cream)" opacity=".5"/>
  </g>
  <text class="t an" style="animation-name:up;--d:.3" x="540" y="450" text-anchor="middle" font-size="118">EXPLICANDO</text>
  <text class="an" style="animation-name:up;--d:.5;fill:var(--cream)" x="540" y="545" text-anchor="middle" font-size="64" font-weight="600" font-style="italic">de um jeito</text>
  <g class="an" style="animation-name:pop;--d:.75">
    <rect x="270" y="590" width="540" height="190" rx="30" fill="var(--red)" transform="rotate(-3 540 685)"/>
    <text x="540" y="740" text-anchor="middle" font-size="170" font-weight="900" fill="#fff" letter-spacing="8" transform="rotate(-3 540 685)">NERD</text>
  </g>
</svg>
</section>

<!-- ============ P5 · sonho → obsessão ============ -->
<section class="panel" data-from="b1" data-to="b2" style="background:linear-gradient(180deg,#1d4a6b,#e89b5a 62%,#f3c98a)">
<div class="an" data-b="b2" style="position:absolute;inset:0;background:linear-gradient(180deg,#1a0508,#7a1020 60%,#c2261f);animation-name:fade;--dur:2.4s"></div>
<svg class="art" viewBox="0 0 1080 1000">
  <circle class="an" style="animation-name:up;--dur:1.6s" cx="760" cy="430" r="120" fill="#ffe7a8"/>
  <g fill="#10131f"><g class="loop lin" style="animation-name:fly;--dur:9s"><path class="loop" style="animation-name:flap;--dur:.5s" d="M0 220q30-40 60 0 30-40 60 0-30-14-60 10-30-24-60-10Z"/></g>
  <g class="loop lin" style="animation-name:fly;--dur:12s;animation-delay:calc((var(--lt) + 4)*-1s)"><path class="loop" style="animation-name:flap;--dur:.6s" d="M0 130q22-30 44 0 22-30 44 0-22-10-44 8-22-18-44-8Z"/></g>
  <g class="loop lin" style="animation-name:fly;--dur:10s;animation-delay:calc((var(--lt) + 7)*-1s)"><path class="loop" style="animation-name:flap;--dur:.45s" d="M0 300q22-30 44 0 22-30 44 0-22-10-44 8-22-18-44-8Z"/></g></g>
  <path d="M-20 1000V560h60v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h60V1000Z" fill="#10131f" opacity=".85"/>
  <!-- sombra que cresce na obsessão -->
  <g class="an" data-b="b2" data-o=".6" style="animation-name:growY;--dur:2.6s;transform-origin:50% 100%">
    <path d="M330 1000C300 700 330 420 420 300c40-56 90-56 130 0 90 120 120 400 90 700Z" fill="#050308" opacity=".88"/>
    <circle class="loop" style="animation-name:glow;--dur:1.2s" cx="452" cy="430" r="13" fill="#ff3b3b"/><circle class="loop" style="animation-name:glow;--dur:1.2s" cx="520" cy="430" r="13" fill="#ff3b3b"/>
  </g>
  <path d="M-20 1000V900q300-90 560-60t560-40v200Z" fill="#0a0c14"/>
  <!-- menino -->
  <g class="an" style="animation-name:up;--d:.4" fill="#0a0c14"><g transform="translate(-290 -520) scale(1.6)">
    <circle cx="486" cy="742" r="30"/><path d="M456 780h60l12 110h-84Z"/><path d="M456 790l-34 60 14 8 30-44ZM516 790l34 60-14 8-30-44Z"/>
    <path d="M512 772q60-6 96 30-50-6-92 4Z" fill="#7a1020"/>
  </g></g>
  <g class="an" data-b="b1" data-f=".45" style="animation-name:pop"><rect x="60" y="60" width="430" height="84" rx="42" fill="rgba(11,13,23,.82)"/><text class="t" x="275" y="118" text-anchor="middle" font-size="44" style="fill:var(--teal)">LIBERDADE</text></g>
  <g class="an" data-b="b1" data-f=".72" style="animation-name:pop"><rect x="590" y="60" width="430" height="84" rx="42" fill="rgba(11,13,23,.82)"/><text class="t" x="805" y="118" text-anchor="middle" font-size="44" style="fill:var(--gold)">PROTEGER</text></g>
  <g class="an" data-b="b2" data-f=".7" style="animation-name:pop"><rect x="290" y="170" width="500" height="100" rx="20" fill="var(--red)" transform="rotate(-4 540 220)"/><text x="540" y="242" text-anchor="middle" font-size="68" font-weight="900" fill="#fff" letter-spacing="6" transform="rotate(-4 540 220)">OBSESSÃO</text></g>
</svg>
</section>

<!-- ============ P6 · destruir o mundo ============ -->
<section class="panel" data-from="b3" style="background:radial-gradient(800px 800px at 50% 35%,#5a1018,#0b0407 75%)">
<svg class="art" viewBox="0 0 1080 1000">
  <g class="loop" style="animation-name:shake;--dur:.5s">
  <g class="an" style="animation-name:pop;transform-origin:540px 500px;transform-box:view-box">
    <circle cx="540" cy="500" r="330" fill="#1c4a66"/>
    <path d="M330 330q80-70 170-30 40 60-20 110-30 70-110 50-70-50-40-130ZM600 300q90-30 170 40 40 90-30 130-90 10-120-60-50-60-20-110ZM420 600q70-40 150 10 60 70 0 150-80 50-140-20-40-80-10-140ZM700 560q60-20 110 30 0 90-70 120-60-30-60-90Z" fill="#3f8a5a"/>
    <circle cx="540" cy="500" r="330" fill="none" stroke="#0b0407" stroke-width="10"/>
    <g fill="none" stroke="#ff4a3d" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" pathLength="1">
      <path class="an" data-b="b3" data-f=".45" style="animation-name:draw;--dur:1.2s;stroke-dasharray:1" pathLength="1" d="M540 170l-50 120 70 60-90 110 80 70-60 130 50 170"/>
      <path class="an" data-b="b3" data-f=".6" style="animation-name:draw;--dur:1s;stroke-dasharray:1" pathLength="1" d="M490 290l-130 40-60 90M560 530l140 30 80 110M470 460l-170 100"/>
    </g>
  </g></g>
  <g class="an" data-b="b3" data-f=".75" style="animation-name:pop"><rect x="190" y="870" width="700" height="100" rx="50" fill="#0b0407" stroke="var(--red)" stroke-width="5"/><text class="t" x="540" y="938" text-anchor="middle" font-size="50">“O ÚNICO CAMINHO”?</text></g>
</svg>
</section>

<!-- ============ P7 · catecismo ============ -->
<section class="panel" data-from="c1" data-to="c2" style="background:radial-gradient(900px 900px at 50% 30%,#4a3a12,#14100a 75%)">
<svg class="art" viewBox="0 0 1080 1000">
  <g class="loop" style="animation-name:spin;--dur:50s;animation-timing-function:linear;transform-origin:540px 330px;transform-box:view-box" opacity=".22" stroke="var(--gold)" stroke-width="14">
    <path d="M540 330L540 -300M540 330L1000 -120M540 330L1200 330M540 330L1000 790M540 330L540 960M540 330L80 790M540 330L-120 330M540 330L80 -120"/>
  </g>
  <path class="an" style="animation-name:pop" d="M505 110h70v130h130v70H575v280h-70V310H375v-70h130Z" fill="var(--gold)"/>
  <g class="an" style="animation-name:up;--d:.5">
    <path d="M160 700q190-70 380 0v260q-190-70-380 0Z" fill="var(--cream)"/><path d="M920 700q-190-70-380 0v260q190-70 380 0Z" fill="#e7dcc0"/>
    <path d="M220 760q130-36 270 0M220 810q130-36 270 0M220 860q130-36 270 0M590 760q140-36 270 0M590 810q140-36 270 0M590 860q140-36 270 0" stroke="#9a8c6a" stroke-width="7" fill="none"/>
    <path d="M540 700v260" stroke="#8e1b2c" stroke-width="8"/>
  </g>
  <g class="an" data-b="c2" data-o=".2" style="animation-name:pop">
    <rect x="130" y="610" width="820" height="330" rx="34" fill="#14100a" stroke="var(--gold)" stroke-width="6"/>
    <text class="t" x="540" y="700" text-anchor="middle" font-size="42" letter-spacing="4" style="fill:var(--gold)">CATECISMO DA IGREJA CATÓLICA</text>
    <text class="t serif" x="540" y="870" text-anchor="middle" font-size="150">§ 1789</text>
  </g>
</svg>
</section>

<!-- ============ P8 · citação ============ -->
<section class="panel" data-from="c3" style="background:radial-gradient(900px 900px at 50% 35%,#3a2c0c,#0f0c07 78%)">
<svg class="art" viewBox="0 0 1080 1000">
  <g class="an" style="animation-name:pop;--dur:.9s">
    <rect x="70" y="80" width="940" height="840" rx="40" fill="var(--cream)"/>
    <rect x="94" y="104" width="892" height="792" rx="26" fill="none" stroke="#b79a4a" stroke-width="5"/>
    <text class="serif" x="130" y="300" font-size="260" fill="#b79a4a" opacity=".55">“</text>
  </g>
  <g class="serif" font-size="74" font-weight="700" fill="#1a1408" text-anchor="middle">

 {id:'d2',pose:'idle', x:220, mood:'sad', text:'Eren buscou a liberdade durante toda a sua vida, mas acabou se tornando prisioneiro das próprias escolhas e da visão de futuro que carregava.'},

 {id:'e1',ch:'A ÁRVORE',pose:'pointL',x:800, mood:'curious', text:'Lembra do primeiro episódio, quando vemos Eren acordando debaixo daquela árvore, chorando sem entender o motivo?'},
 {id:'e2',pose:'idle', x:800, mood:'sad', text:'Depois de conhecer toda a história, aquela cena ganha um significado muito mais doloroso.'},
 {id:'e3',pose:'idle', x:540, mood:'sad', text:'É como se aquelas lágrimas fossem o eco de uma tragédia que ele ainda nem sabia que viveria.'},
 {id:'e4',pose:'sad',  x:540, mood:'sad', hold:.8, text:'O menino que sonhava em conhecer o mundo acabaria tentando destruí-lo.'},

 {id:'f1',ch:'A REFLEXÃO',pose:'pointR',x:240, mood:'neutral', text:'E talvez essa seja a maior reflexão de Attack on Titan:'},
 {id:'f2',pose:'emph', x:240, mood:'serious', text:'Quando o desejo de proteger alguém nos faz esquecer o valor da vida dos outros, aquilo que chamamos de amor pode se transformar em obsessão.'},
 {id:'f3',pose:'emph', x:540, mood:'serious', hold:.6, text:'Porque a verdadeira caridade não é salvar uns destruindo outros.'},
 {id:'f4',pose:'shrug',x:540, mood:'neutral', hold:.6, text:'O bem não se torna justo apenas porque nossas intenções são boas.'},
 {id:'f5',pose:'pointL',x:840, mood:'curious', hold:1.2, text:'E você? Acha que Eren foi realmente livre?'},
 {id:'f6',pose:'wave', x:540, mood:'happy', hold:1.6, text:'Esse foi o Explicando de um Jeito Nerd. Até o próximo episódio!'},
];

/* ---------- linha do tempo ---------- */
let T = 0.4;
for (const b of BEATS) {
  b.words = b.text.split(/\s+/);
  b.speak = b.dur ?? Math.max(1.4, b.words.length / WPS);
  b.start = T; b.len = b.speak + .45 + (b.hold || 0); T += b.len; b.end = T;
  // quebra a fala em blocos curtos de legenda
  b.chunks = []; let cur = [];
  b.words.forEach((w, i) => {
    cur.push(i);
    const stop = /[,:;.!?”]$/.test(w);
    if (cur.length >= 6 || (stop && cur.length >= 3) || i === b.words.length - 1) { b.chunks.push(cur); cur = []; }
  });
  if (b.chunks.length > 1 && b.chunks.at(-1).length < 2) { const l = b.chunks.pop(); b.chunks.at(-1).push(...l); }
}
const DUR = T + .6;
const byId = Object.fromEntries(BEATS.map(b => [b.id, b]));

/* ---------- painéis ---------- */
document.getElementById('outro').innerHTML = document.querySelector('.panel.logo').innerHTML;
const panels = [...document.querySelectorAll('.panel')].map(el => {
  const from = byId[el.dataset.from], to = byId[el.dataset.to || el.dataset.from];
  const p = {el, start: from.start, end: to.end};
  el.querySelectorAll('[data-b]').forEach(n => {
    const b = byId[n.dataset.b];
    n.style.setProperty('--d', (b.start - p.start + (+n.dataset.f || 0) * b.speak + (+n.dataset.o || 0)).toFixed(3));
  });
  return p;
});
panels[0].start = 0; panels.at(-1).end = DUR + 1;

/* ---------- boneco ---------- */
const $ = id => document.getElementById(id);
const POSES = {
  idle:  {L: 8,  R: -8,  head: 0},
  wave:  {L: 8,  R: -124, head: 4, wave: 1},
  pointL:{L: 128, R: -8, head: -5},
  pointR:{L: 8,  R: -128, head: 5},
  shrug: {L: 62, R: -62, head: 0, bounce: 1},
  emph:  {L: 34, R: -34, head: 0, bounce: 1},
  sad:   {L: 3,  R: -3,  head: 7},
};
const MOODS = { neutral:[0,0,0], curious:[-4,6,-7], happy:[-3,3,-4], serious:[11,-11,3], sad:[-15,15,-2] };
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0 ? 0 : k > 1 ? 1 : k * k * (3 - 2 * k);
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

function boneco(t, bi) {
  const b = BEATS[bi], prev = BEATS[Math.max(0, bi - 1)];
  const lt = t - b.start, k = ease(lt / .45);
  const A = POSES[prev.pose], B = POSES[b.pose], MA = MOODS[prev.mood], MB = MOODS[b.mood];
  // caminhada entre posições
  const dist = Math.abs(b.x - prev.x), wd = Math.max(.5, dist / 520), wk = ease(lt / wd);
  const x = lerp(prev.x, b.x, wk), walking = dist > 4 && lt < wd;
  const step = walking ? Math.sin(lt * 13) : 0, dir = Math.sign(b.x - prev.x);
  let L = lerp(A.L, B.L, k), R = lerp(A.R, B.R, k), head = lerp(A.head, B.head, k);
  const speaking = lt > .12 && lt < b.speak + .15;
  if (B.wave) R += Math.sin(t * 9) * 16 * k;
  if (B.bounce && speaking) { L += Math.sin(t * 5.2) * 9; R -= Math.sin(t * 5.2 + .7) * 9; }
  if (walking) { L += step * 16; R += step * 16; }
  const bobY = walking ? -Math.abs(step) * 10 : Math.sin(t * 2.4) * 3 + (speaking ? Math.sin(t * 7) * 1.6 : 0);
  $('boneco').style.transform = `translate(${x - 175}px,0)`;
  $('bk').style.transform = `translateY(${bobY}px) rotate(${walking ? dir * 4 : 0}deg)`;
  $('bk').style.transformOrigin = '200px 560px';
  $('legL').style.transform = `rotate(${step * 24}deg)`; $('legR').style.transform = `rotate(${-step * 24}deg)`;
  $('armL').style.transform = `rotate(${L}deg)`; $('armR').style.transform = `rotate(${R}deg)`;
  $('head').style.transform = `rotate(${head + Math.sin(t * 1.7) * 1.5}deg)`;
  $('browL').style.transform = `translateY(${lerp(MA[2], MB[2], k)}px) rotate(${lerp(MA[0], MB[0], k)}deg)`;
  $('browR').style.transform = `translateY(${lerp(MA[2], MB[2], k)}px) rotate(${lerp(MA[1], MB[1], k)}deg)`;
  // piscada
  const bp = (t % 3.7); $('eyes').style.transform = `scaleY(${bp < .12 ? .12 : 1})`;
  $('pup').style.transform = `translate(${B.L > 100 ? -4 : B.R < -100 && !B.wave ? 4 : 0}px,${b.mood === 'sad' ? 4 : B.L > 100 || (B.R < -100 && !B.wave) ? -4 : 0}px)`;
  // boca
  let m = 0;
  if (speaking) { const h = hash(Math.floor(t * 9.5)); m = h < .28 ? 0 : h < .68 ? 1 : 2; if (m === 0 && b.mood === 'sad') m = 3; }
  else if (b.mood === 'sad' || b.mood === 'serious') m = 3;
  ['m0', 'm1', 'm2', 'm3'].forEach((id, i) => $(id).style.display = i === m ? '' : 'none');
}

/* ---------- legenda ---------- */
let capKey = '';
function caption(t, bi) {
  const b = BEATS[bi], lt = t - b.start, cap = $('cap');
  const wi = Math.min(b.words.length - 1, Math.floor(Math.max(0, lt - .1) / b.speak * b.words.length));
  const ci = b.chunks.findIndex(c => c.includes(wi)), key = bi + ':' + ci;
  if (key !== capKey) { capKey = key; cap.innerHTML = '<div>' + b.chunks[ci].map(i => `<span data-i="${i}">${b.words[i]}</span>`).join(' ') + '</div>'; }
  const said = lt > .1;
  cap.querySelectorAll('span').forEach(s => { const i = +s.dataset.i; s.className = !said ? '' : i < wi ? 'on' : i === wi ? (lt < b.speak + .1 ? 'on now' : 'on') : ''; });
  const first = b.chunks[ci][0], tin = b.start + .1 + first / b.words.length * b.speak;
  const kk = ease((t - tin + .08) / .18);
  cap.style.opacity = Math.min(kk, ease((b.end - t) / .15) || 0) ; cap.style.transform = `translateY(${(1 - kk) * 18}px)`;
}

/* ---------- quadro ---------- */
function seek(t) {
  t = Math.max(0, Math.min(DUR, t));
  for (const p of panels) {
    const o = Math.min(ease((t - p.start + .22) / .45), ease((p.end + .22 - t) / .45));
    p.el.style.opacity = t < 0.3 && p === panels[0] ? 1 : o;
    p.el.style.visibility = o <= 0 && !(p === panels[0] && t < .3) ? 'hidden' : 'visible';
    p.el.style.setProperty('--lt', (t - p.start).toFixed(4));
  }
  let bi = BEATS.findIndex(b => t < b.end); if (bi < 0) bi = BEATS.length - 1;
  if (t < BEATS[0].start) bi = 0;
  boneco(Math.max(t, BEATS[0].start), bi); caption(t, bi);
  let ch = ''; for (let i = 0; i <= bi; i++) if (BEATS[i].ch) ch = BEATS[i].ch;
  $('chapter').textContent = ch;
  document.querySelector('#bar i').style.width = (t / DUR * 100) + '%';
  window.__t = t;
}
window.__dur = DUR; window.__seek = seek;

/* ---------- prévia no navegador ---------- */
const q = new URLSearchParams(location.search), stage = $('stage');
function fit() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = `translate(${(innerWidth - 1080 * s) / 2}px,${(innerHeight - 1920 * s) / 2}px) scale(${s})`; }
if (q.has('render')) { seek(0); }
else {
  fit(); addEventListener('resize', fit);
  let t0 = performance.now() - (+q.get('t') || 0) * 1000, playing = !q.has('pause'), cur = +q.get('t') || 0;
  const loop = now => { if (playing) { cur = ((now - t0) / 1000) % DUR; seek(cur); } requestAnimationFrame(loop); };
  seek(cur); requestAnimationFrame(loop);
  const toggle = () => { playing = !playing; if (playing) t0 = performance.now() - cur * 1000; };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { cur = Math.max(0, Math.min(DUR - .05, cur + (e.code === 'ArrowRight' ? 3 : -3))); t0 = performance.now() - cur * 1000; seek(cur); }
  });
  $('bar').addEventListener('click', e => { e.stopPropagation(); const r = $('bar').getBoundingClientRect(); cur = (e.clientX - r.left) / r.width * DUR; t0 = performance.now() - cur * 1000; seek(cur); });
  stage.addEventListener('click', toggle);
}
</script>
</body>
