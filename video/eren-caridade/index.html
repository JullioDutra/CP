<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eren e a caridade — Explicando de um Jeito Nerd</title>
<style>
/* Paleta do quadro: grafite, marfim, dourado discreto, vermelho queimado e verde acinzentado */
:root{
  --ink:#14161a; --ink2:#1b1e24; --ivory:#f1ede4; --gold:#bfa57e; --red:#8a4a44; --sage:#7d8782;
  --skin:#d4a07a; --skin2:#b98562; --hair:#171210; --wine:#7a2533;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Inter,"Inter Display",system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:var(--ink);color:var(--ivory)}
.serif{font-family:"DejaVu Serif",Georgia,serif}

/* ---------- motor de animação: tudo depende de --lt (tempo local da cena) ---------- */
.panel{position:absolute;inset:0;opacity:0;--lt:0}
.panel svg.art{position:absolute;left:0;top:170px;width:1080px;height:1100px;overflow:visible}
.an{--d:0;animation-duration:var(--dur,.9s);animation-fill-mode:both;animation-play-state:paused;
  animation-timing-function:cubic-bezier(.25,.6,.25,1);animation-delay:calc((var(--d,0) - var(--lt,0))*1s);
  transform-box:fill-box;transform-origin:center}
.loop{animation-duration:var(--dur,3s);animation-iteration-count:infinite;animation-play-state:paused;
  animation-timing-function:ease-in-out;animation-delay:calc(var(--lt,0)*-1s);transform-box:fill-box;transform-origin:center}
.lin{animation-timing-function:linear}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.04)}28%{transform:scale(1)}}
@keyframes fly{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@keyframes tear{0%{opacity:0;transform:translateY(0)}15%{opacity:1}80%{opacity:1;transform:translateY(46px)}100%{opacity:0;transform:translateY(52px)}}
@keyframes ripple{0%{opacity:.7;transform:scale(.1)}100%{opacity:0;transform:scale(1)}}
@keyframes leaf{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate(-140px,560px) rotate(300deg)}}
@keyframes swing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:.85}}

.k{font-weight:700;letter-spacing:.24em;fill:var(--gold)}
.h{font-weight:800;fill:var(--ivory);letter-spacing:.01em}

/* ---------- cromo fixo ---------- */
#brand{position:absolute;left:0;right:0;top:62px;text-align:center;font-weight:600;font-size:23px;letter-spacing:.34em;color:rgba(241,237,228,.6)}
#brand b{color:var(--gold);font-weight:700}
#bar{position:absolute;left:80px;right:80px;top:112px;height:3px;background:rgba(241,237,228,.14);cursor:pointer}
#bar i{display:block;height:100%;width:0;background:var(--gold)}
#topshade{position:absolute;left:0;right:0;top:0;height:230px;background:linear-gradient(180deg,rgba(14,15,18,.85),rgba(14,15,18,0))}
#shade{position:absolute;left:0;right:0;bottom:0;height:760px;background:linear-gradient(180deg,rgba(14,15,18,0),rgba(14,15,18,.9) 34%,#0e0f12 70%)}
#cap{position:absolute;left:70px;right:70px;top:1392px;height:180px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:800;font-size:54px;line-height:1.2;text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 22px rgba(0,0,0,.85)}
#cap span{display:inline-block;margin:0 .12em;opacity:.4}
#cap span.on{opacity:1}
#cap span.now{color:var(--gold)}

/* estúdio + quadro de texto (cenas com o apresentador) */
#card{position:absolute;left:80px;right:80px;top:200px;height:590px;border-radius:26px;background:rgba(27,30,36,.94);border:1.5px solid rgba(191,165,126,.35);
  display:flex;flex-direction:column;justify-content:center;padding:0 64px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
#card .kick{font-weight:700;font-size:27px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:30px;line-height:1.4}
#card .ttl{font-family:"DejaVu Serif",Georgia,serif;font-size:78px;line-height:1.14;color:var(--ivory)}
#card .ttl em{font-style:normal;color:var(--gold)}
#card .ttl .r{color:#c98078}
#card .logo{font-weight:400;font-size:84px;line-height:1.12;letter-spacing:.01em}
#card .logo em{font-style:normal;color:var(--gold)}
#card hr{border:0;border-top:1.5px solid rgba(191,165,126,.45);margin:36px 0 28px}
#card .foot{font-weight:500;font-size:27px;letter-spacing:.14em;color:rgba(241,237,228,.72);text-transform:uppercase}

/* apresentador */
#av{position:absolute;overflow:visible}
#av.full{left:140px;top:797px;width:800px;height:1133px}
#av.pip{left:60px;top:1128px;width:216px;height:216px;border-radius:50%;overflow:hidden;background:var(--ink2);border:3px solid var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.5)}
#av svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#av.pip svg{width:381px;height:540px;left:-82px;top:-24px}
#av svg g,#av svg path{transform-box:view-box}
</style>
</head>
<body>
<div id="stage">

<!-- ============ ESTÚDIO (fundo das cenas com o apresentador) ============ -->
<section class="panel" id="studio" style="background:radial-gradient(900px 900px at 50% 62%,#262a31,#14161a 75%)">
<svg style="position:absolute;inset:0" viewBox="0 0 1080 1920">

  </g>
</svg>
</section>

<!-- ============ caridade, liberdade, fé ============ -->
<section class="panel" id="temas" style="background:linear-gradient(170deg,#1b1e24,#14161a 60%)">
<svg class="art" viewBox="0 0 1080 1100">
  <text class="k an" style="animation-name:up" x="100" y="120" font-size="30">A HISTÓRIA DE</text>
  <text class="h serif an" style="animation-name:up;--d:.3" x="100" y="230" font-size="100">Eren Yeager</text>

  <g class="an" data-b="a3" data-f=".52" style="animation-name:up">

    <text class="h serif" x="240" y="945" font-size="96">a nossa fé</text></g>
</svg>
</section>

<!-- ============ sonho → obsessão ============ -->
<section class="panel" id="jornada" style="background:linear-gradient(180deg,#56646a,#c9b48f 58%,#e8dcc4)">
<div class="an" data-b="b2" style="position:absolute;inset:0;background:linear-gradient(180deg,#191113,#5a2a28 60%,#8a4a44);animation-name:fade;--dur:3s"></div>
<svg class="art" viewBox="0 0 1080 1100">
  <circle class="an" style="animation-name:up;--dur:2s" cx="770" cy="470" r="118" fill="#f6ecd2"/>
  <g fill="#14161a"><g class="loop lin" style="animation-name:fly;--dur:11s"><path class="loop" style="animation-name:flap;--dur:.55s" d="M0 240q30-40 60 0 30-40 60 0-30-14-60 10-30-24-60-10Z"/></g>
  <g class="loop lin" style="animation-name:fly;--dur:14s;animation-delay:calc((var(--lt) + 5)*-1s)"><path class="loop" style="animation-name:flap;--dur:.65s" d="M0 150q22-30 44 0 22-30 44 0-22-10-44 8-22-18-44-8Z"/></g>
  <g class="loop lin" style="animation-name:fly;--dur:12s;animation-delay:calc((var(--lt) + 8)*-1s)"><path class="loop" style="animation-name:flap;--dur:.5s" d="M0 330q22-30 44 0 22-30 44 0-22-10-44 8-22-18-44-8Z"/></g></g>
  <path d="M-20 1100V600h60v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h70v-26h50v26h60V1100Z" fill="#14161a" opacity=".86"/>
  <g class="an" data-b="b2" data-o=".8" style="animation-name:growY;--dur:3.2s;transform-origin:50% 100%">
    <path d="M300 1100C270 780 300 470 410 330c44-60 96-60 140 0 110 140 140 450 110 770Z" fill="#0b0a0c" opacity=".9"/>
    <circle class="loop" style="animation-name:glow;--dur:2.4s" cx="446" cy="470" r="10" fill="#c9675c"/><circle class="loop" style="animation-name:glow;--dur:2.4s" cx="514" cy="470" r="10" fill="#c9675c"/>
  </g>
  <path d="M-20 1100V960q300-90 560-60t560-40v240Z" fill="#0e0f12"/>
  <g class="an" style="animation-name:up;--d:.5" fill="#0e0f12"><g transform="translate(-300 -470) scale(1.6)">
    <circle cx="486" cy="742" r="30"/><path d="M456 780h60l12 110h-84Z"/><path d="M456 790l-34 60 14 8 30-44ZM516 790l34 60-14 8-30-44Z"/>
    <path d="M512 772q60-6 96 30-50-6-92 4Z" fill="#5a2a28"/>
  </g></g>
  <g class="an" data-b="b1" data-f=".45" style="animation-name:up"><text class="k" x="80" y="110" font-size="30" style="fill:#14161a">O SONHO</text><text class="serif" x="80" y="200" font-size="72" font-weight="700" fill="#14161a">liberdade</text></g>
  <g class="an" data-b="b1" data-f=".7" style="animation-name:up"><text class="serif" x="80" y="290" font-size="72" font-weight="700" fill="#14161a">e proteção</text></g>
  <g class="an" data-b="b2" data-f=".72" style="animation-name:in"><rect x="560" y="120" width="460" height="130" fill="#14161a"/><text class="serif" x="790" y="212" text-anchor="middle" font-size="76" font-weight="700" fill="#e9c9b9">obsessão</text></g>
</svg>
</section>

<!-- ============ destruir o mundo ============ -->
<section class="panel" id="mundo" style="background:radial-gradient(800px 900px at 50% 38%,#3a2422,#14161a 75%)">
<svg class="art" viewBox="0 0 1080 1100">
  <g class="an" style="animation-name:in;--dur:1.4s;transform-origin:540px 480px;transform-box:view-box">

  </g>
  <g class="an" data-b="b3" data-f=".8" style="animation-name:up"><text class="serif" x="540" y="960" text-anchor="middle" font-size="64" font-style="italic" fill="var(--ivory)">“o único caminho”?</text></g>
</svg>
</section>

<!-- ============ igreja + catecismo ============ -->
<section class="panel" id="igreja" style="background:linear-gradient(180deg,#1b1e24,#14161a)">
<svg class="art" viewBox="0 0 1080 1100">
  <g class="an" style="animation-name:fade;--dur:1.6s">
    <path d="M540 -40L160 1100H920Z" fill="#f1ede4" opacity=".05"/>
    <g fill="#f1ede4" opacity=".1"><path d="M110 620V260q0-90 80-90t80 90v360Z"/><path d="M810 620V260q0-90 80-90t80 90v360Z"/></g>

  </g>

  <g class="an" data-b="c2" data-f=".5" style="animation-name:up"><text class="h serif" x="540" y="760" text-anchor="middle" font-size="110">§ 1789</text></g>
</svg>
</section>

<!-- ============ citação ============ -->

<svg class="art" viewBox="0 0 1080 1100">

</svg>
</section>

<!-- ============ o caminho importa ============ -->
<section class="panel" id="caminho" style="background:linear-gradient(180deg,#1b1e24,#14161a)">
<svg class="art" viewBox="0 0 1080 1100">
  <g fill="none" stroke-linecap="round" stroke-width="40">
    <path class="an" style="animation-name:draw;--dur:1.2s;stroke-dasharray:1" pathLength="1" d="M620 1040V720" stroke="#3a3f48"/>

  </g>

  <g class="an" style="animation-name:up;--d:2.2"><text class="serif" x="290" y="300" text-anchor="middle" font-size="60" font-weight="700" fill="#c98078">pelo mal</text><path d="M262 180l56 56M318 180l-56 56" stroke="#c98078" stroke-width="12" stroke-linecap="round"/></g>
  <g class="an" style="animation-name:up;--d:2.5"><text class="serif" x="870" y="300" text-anchor="middle" font-size="60" font-weight="700" fill="var(--gold)">pelo bem</text><path d="M838 210l24 26 44-52" stroke="var(--gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
  <g class="an" data-b="c4" data-f=".55" style="animation-name:up"><text class="h serif" x="540" y="90" text-anchor="middle" font-size="68">O caminho também importa.</text></g>
</svg>
</section>

<!-- ============ prisioneiro ============ -->
<section class="panel" id="gaiola" style="background:radial-gradient(800px 900px at 50% 42%,#262a31,#14161a 75%)">
<svg class="art" viewBox="0 0 1080 1100">
  <g class="an" style="animation-name:up">
    <text class="h serif" x="540" y="110" text-anchor="middle" font-size="84" style="fill:var(--sage)">liberdade</text>
    <rect class="an" data-b="d2" data-f=".46" style="animation-name:strike;--dur:.8s;transform-origin:0 50%" x="290" y="78" width="500" height="8" fill="#c98078"/>
  </g>
  <g class="loop" style="animation-name:swing;--dur:6s;transform-origin:540px 170px;transform-box:view-box">
    <path d="M540 160v80" stroke="#6a7078" stroke-width="8"/>
    <g class="loop" style="animation-name:bob;--dur:1.8s"><path d="M430 580q55-80 110-10 55-70 110 10-55-34-110 22-55-56-110-22Z" fill="var(--ivory)"/><circle cx="540" cy="600" r="18" fill="var(--ivory)"/></g>

<script>
/* ============================================================
   ROTEIRO — cada fala é um "beat".
     scene : 'studio' (apresentador grande + quadro de texto) ou o id de uma cena ilustrada
     pip   : true mostra o apresentador numa bolinha comentando a cena
     expr  : neutra | curiosa | reflexiva | seria
     dur   : (opcional) segundos da fala, para casar com a sua narração;
             sem `dur`, calcula pelo número de palavras (WPS).
   ============================================================ */
const WPS = 2.6;
const LOGO = `<div class="kick">Um videoensaio sobre histórias e ideias</div><div class="logo">EXPLICANDO<br>DE UM JEITO <em>NERD.</em></div><hr><div class="foot">Anime · Filosofia · Fé · Cultura pop</div>`;
const BEATS = [
 {id:'a1',scene:'studio',expr:'neutra', card:`<div class="kick">Attack on Titan</div><div class="ttl">Um dilema.</div>`, text:'Se você já assistiu Attack on Titan, provavelmente se deparou com um dilema:'},
 {id:'a2',scene:'studio',expr:'curiosa',hold:1, card:`<div class="kick">Attack on Titan</div><div class="ttl">Até onde o <em>bem</em> justifica o <span class="r">mal</span>?</div>`, text:'Até onde o bem justifica o mal?'},
 {id:'a3',scene:'temas',pip:true,expr:'curiosa', text:'E se eu te dissesse que a história de Eren Yeager pode nos ensinar algo muito profundo sobre a caridade, a liberdade e até mesmo sobre a nossa fé?'},
 {id:'a4',scene:'studio',expr:'neutra',hold:.8, card:LOGO, text:'Bem-vindo ao Explicando de um Jeito Nerd!'},

 {id:'b1',scene:'jornada',expr:'neutra', text:'Eren começou sua jornada com um sonho: conquistar a liberdade e proteger aqueles que amava.'},
 {id:'b2',scene:'jornada',expr:'seria', text:'Mas, aos poucos, esse desejo de proteção se transformou em obsessão.'},
 {id:'b3',scene:'mundo',pip:true,expr:'seria', text:'Ele queria tanto salvar seus amigos que passou a acreditar que destruir o mundo era o único caminho.'},

 {id:'c1',scene:'studio',expr:'reflexiva', card:`<div class="kick">A fé entra na conversa</div><div class="ttl">Um ensinamento do <em>catolicismo</em>.</div>`, text:'E é aqui que entra um ensinamento muito importante do catolicismo.'},
 {id:'c2',scene:'igreja',expr:'neutra', text:'O Catecismo da Igreja Católica, no parágrafo 1789, nos ensina:'},
 {id:'c3',scene:'citacao',expr:'seria',hold:1.6, text:'“Nunca é permitido fazer mal para que daí resulte um bem.”'},
 {id:'c4',scene:'caminho',pip:true,expr:'reflexiva', text:'Ou seja, não basta querer fazer o bem. O caminho que escolhemos também importa.'},

 {id:'d1',scene:'studio',expr:'curiosa', card:`<div class="kick">O próprio anime mostra</div><div class="ttl">A contradição.</div>`, text:'E o próprio anime nos mostra essa contradição.'},
 {id:'d2',scene:'gaiola',expr:'seria', text:'Eren buscou a liberdade durante toda a sua vida, mas acabou se tornando prisioneiro das próprias escolhas e da visão de futuro que carregava.'},

 {id:'e1',scene:'arvore',expr:'neutra', text:'Lembra do primeiro episódio, quando vemos Eren acordando debaixo daquela árvore, chorando sem entender o motivo?'},
 {id:'e2',scene:'arvore',expr:'reflexiva', text:'Depois de conhecer toda a história, aquela cena ganha um significado muito mais doloroso.'},
 {id:'e3',scene:'arvore',expr:'reflexiva', text:'É como se aquelas lágrimas fossem o eco de uma tragédia que ele ainda nem sabia que viveria.'},
 {id:'e4',scene:'arvore',expr:'seria',hold:.8, text:'O menino que sonhava em conhecer o mundo acabaria tentando destruí-lo.'},

 {id:'f1',scene:'studio',expr:'reflexiva', card:`<div class="kick">Attack on Titan</div><div class="ttl">A maior reflexão.</div>`, text:'E talvez essa seja a maior reflexão de Attack on Titan:'},
 {id:'f2',scene:'coracao',expr:'seria', text:'Quando o desejo de proteger alguém nos faz esquecer o valor da vida dos outros, aquilo que chamamos de amor pode se transformar em obsessão.'},
 {id:'f3',scene:'caridade',expr:'seria',hold:.6, text:'Porque a verdadeira caridade não é salvar uns destruindo outros.'},
 {id:'f4',scene:'intencoes',pip:true,expr:'reflexiva',hold:.6, text:'O bem não se torna justo apenas porque nossas intenções são boas.'},
 {id:'f5',scene:'studio',expr:'curiosa',hold:1.2, card:`<div class="kick">E você?</div><div class="ttl">Eren foi realmente <em>livre</em>?</div><hr><div class="foot">Responda nos comentários</div>`, text:'E você? Acha que Eren foi realmente livre?'},
 {id:'f6',scene:'studio',expr:'neutra',hold:1.6, card:LOGO.replace('Anime · Filosofia · Fé · Cultura pop','Até o próximo episódio'), text:'Esse foi o Explicando de um Jeito Nerd. Até o próximo episódio!'},
];

/* ---------- linha do tempo ---------- */
let T = 0.4;
for (const b of BEATS) {
  b.words = b.text.split(/\s+/);
  b.speak = b.dur ?? Math.max(1.4, b.words.length / WPS);
  b.start = T; b.len = b.speak + .45 + (b.hold || 0); T += b.len; b.end = T;
  b.mode = b.scene === 'studio' ? 'full' : b.pip ? 'pip' : 'none';
  b.chunks = []; let cur = [];
  b.words.forEach((w, i) => {
    cur.push(i);
    const stop = /[,:;.!?”]$/.test(w);
    if (cur.length >= 6 || (stop && cur.length >= 3) || i === b.words.length - 1) { b.chunks.push(cur); cur = []; }
  });
  if (b.chunks.length > 1 && b.chunks.at(-1).length < 2) { const l = b.chunks.pop(); b.chunks.at(-1).push(...l); }
}
const DUR = T + .6;
const byId = Object.fromEntries(BEATS.map(b => [b.id, b]));
const $ = id => document.getElementById(id);
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0 ? 0 : k > 1 ? 1 : k * k * (3 - 2 * k);
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

/* ---------- cenas: junta falas seguidas da mesma cena em trechos ---------- */
const segs = [];
BEATS.forEach(b => { const l = segs.at(-1); if (l && l.scene === b.scene) l.end = b.end; else segs.push({scene: b.scene, start: b.start, end: b.end}); });
segs[0].start = 0; segs.at(-1).end = DUR + 1;
const panels = [...document.querySelectorAll('.panel')].map(el => ({el, segs: segs.filter(s => s.scene === el.id)}));
for (const p of panels) p.el.querySelectorAll('[data-b]').forEach(n => {
  const b = byId[n.dataset.b];
  n.style.setProperty('--d', (b.start - p.segs[0].start + (+n.dataset.f || 0) * b.speak + (+n.dataset.o || 0)).toFixed(3));
});

/* ---------- apresentador ---------- */
//            sobrancelha E [dy, rot]   sobrancelha D [dy, rot]   olhar [x, y]   cabeça   boca em repouso
const EXPR = {
  neutra:    {bl:[0, 0],   br:[0, 0],   gaze:[0, 0],  head: 0,   rest:'m0'},
  curiosa:   {bl:[-9, -5], br:[-3, 2],  gaze:[0, -2], head:-3,   rest:'m0'},
  reflexiva: {bl:[-3, -6], br:[-3, 6],  gaze:[-6, 4], head: 3.5, rest:'m3'},
  seria:     {bl:[5, 7],   br:[5, -7],  gaze:[0, 1],  head: 0,   rest:'m3'},
};
function presenter(t, bi) {
  const b = BEATS[bi], prev = BEATS[Math.max(0, bi - 1)], next = BEATS[bi + 1];
  const lt = t - b.start, k = ease(lt / .5), A = EXPR[prev.expr], B = EXPR[b.expr];
  const av = $('av');
  // visibilidade: some/aparece quando o modo muda entre falas
  let o = b.mode === 'none' ? 0 : 1;
  if (b.mode !== 'none' && prev.mode !== b.mode && bi > 0) o = ease((lt - .1) / .35);
  if (b.mode !== 'none' && next && next.mode !== b.mode) o = Math.min(o, ease((b.end - t - .05) / .3));
  av.style.opacity = o; av.className = b.mode === 'pip' ? 'pip' : 'full';
  const speaking = lt > .12 && lt < b.speak + .15;
  const mix = (a, c) => lerp(a, c, k);
  $('head').style.transform = `translateY(${speaking ? Math.sin(t * 6.3) * 1.6 : 0}px) rotate(${mix(A.head, B.head) + Math.sin(t * 1.3) * 1.1}deg)`;
  $('body').style.transform = `translateY(${Math.sin(t * 1.9) * 2 - 34}px)`;
  $('browL').style.transform = `translateY(${mix(A.bl[0], B.bl[0])}px) rotate(${mix(A.bl[1], B.bl[1])}deg)`;
  $('browR').style.transform = `translateY(${mix(A.br[0], B.br[0])}px) rotate(${mix(A.br[1], B.br[1])}deg)`;
  const drift = Math.sin(t * .7) * 1.5;
  $('pup').style.transform = `translate(${mix(A.gaze[0], B.gaze[0]) + drift}px,${mix(A.gaze[1], B.gaze[1])}px)`;
  $('eyes').style.transform = `scaleY(${(t % 4.1) < .13 ? .1 : 1})`;
  let m = B.rest;
  if (speaking) { const h = hash(Math.floor(t * 9)); m = h < .3 ? B.rest : h < .72 ? 'm1' : 'm2'; }
  for (const id of ['m0', 'm1', 'm2', 'm3']) $(id).style.display = id === m ? '' : 'none';
}

/* ---------- quadro de texto do estúdio ---------- */
let cardKey = -1;
function card(t, bi) {
  const b = BEATS[bi], el = $('card');
  if (b.scene !== 'studio') { el.style.opacity = 0; return; }
  if (cardKey !== bi) { cardKey = bi; el.innerHTML = b.card; }
  const k = Math.min(ease((t - b.start) / .5), ease((b.end - t) / .3));
  el.style.opacity = t < .5 ? 1 : k; el.style.transform = `translateY(${(1 - ease((t - b.start) / .5)) * 14}px)`;
}

/* ---------- legenda ---------- */
let capKey = '';
function caption(t, bi) {
  const b = BEATS[bi], lt = t - b.start, cap = $('cap');
  const wi = Math.min(b.words.length - 1, Math.floor(Math.max(0, lt - .1) / b.speak * b.words.length));
  const ci = b.chunks.findIndex(c => c.includes(wi)), key = bi + ':' + ci;
  if (key !== capKey) { capKey = key; cap.innerHTML = '<div>' + b.chunks[ci].map(i => `<span data-i="${i}">${b.words[i]}</span>`).join(' ') + '</div>'; }
  const said = lt > .1;
  cap.querySelectorAll('span').forEach(s => { const i = +s.dataset.i; s.className = !said ? '' : i < wi ? 'on' : i === wi ? (lt < b.speak + .1 ? 'on now' : 'on') : ''; });
  const tin = b.start + .1 + b.chunks[ci][0] / b.words.length * b.speak;
  cap.style.opacity = Math.min(ease((t - tin + .08) / .2), ease((b.end - t) / .15));
}

/* ---------- quadro ---------- */
function seek(t) {
  t = Math.max(0, Math.min(DUR, t));
  for (const p of panels) {
    let o = 0, s0 = p.segs[0];
    for (const s of p.segs) { const v = Math.min(ease((t - s.start + .25) / .5), ease((s.end + .25 - t) / .5)); if (v > o) { o = v; s0 = s; } }
    if (t < .3 && p.segs[0]?.start === 0) o = 1;
    p.el.style.opacity = o; p.el.style.visibility = o <= 0 ? 'hidden' : 'visible';
    p.el.style.setProperty('--lt', (t - (s0 ? s0.start : 0)).toFixed(4));
  }
  let bi = BEATS.findIndex(b => t < b.end); if (bi < 0) bi = BEATS.length - 1;
  presenter(Math.max(t, BEATS[0].start), bi); card(t, bi); caption(t, bi);
  document.querySelector('#bar i').style.width = (t / DUR * 100) + '%';
}
window.__dur = DUR; window.__seek = seek;

/* ---------- prévia no navegador: espaço pausa, setas avançam, clique na barra pula ---------- */
const q = new URLSearchParams(location.search), stage = $('stage');
function fit() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = `translate(${(innerWidth - 1080 * s) / 2}px,${(innerHeight - 1920 * s) / 2}px) scale(${s})`; }
if (q.has('render')) { seek(0); }
else {
  fit(); addEventListener('resize', fit);
  let cur = +q.get('t') || 0, t0 = performance.now() - cur * 1000, playing = !q.has('pause');
  const loop = now => { if (playing) { cur = ((now - t0) / 1000) % DUR; seek(cur); } requestAnimationFrame(loop); };
  seek(cur); requestAnimationFrame(loop);
  const toggle = () => { playing = !playing; if (playing) t0 = performance.now() - cur * 1000; };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { cur = Math.max(0, Math.min(DUR - .05, cur + (e.code === 'ArrowRight' ? 3 : -3))); t0 = performance.now() - cur * 1000; seek(cur); }
  });
  $('bar').addEventListener('click', e => { e.stopPropagation(); const r = $('bar').getBoundingClientRect(); cur = (e.clientX - r.left) / r.width * DUR; t0 = performance.now() - cur * 1000; seek(cur); });
  stage.addEventListener('click', toggle);
}
</script>
